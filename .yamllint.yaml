# YAML lint configuration for Kubernetes/Helm manifests
---
extends: default

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    forbid-duplicated-merge-keys: true
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: whatever

ignore:
  - 'helm/charts/**/templates/**'
  - 'node_modules/**'
  - '.terraform/**'
