# =============================================================================
# InferencePool — groups the PROD vLLM pods + wires the EPP
# =============================================================================
# Points at the REAL production workload (inference-prod), not a synthetic pool
# — the whole point is to prove cache-aware routing on the promoted, signed
# prod deployment. Gateway API Inference Extension v1.6.0.
#   selector          -> prod's vLLM pods (the promoted vllm-prod deployment)
#   targetPorts       -> vLLM :8000
#   endpointPickerRef -> the EPP Service that scores/picks a pod per request
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-prod-pool
  namespace: inference-prod
  labels:
    app.kubernetes.io/part-of: inferentia
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-inference
      app.kubernetes.io/instance: vllm-prod
  targetPorts:
    - number: 8000
  endpointPickerRef:
    group: ""
    kind: Service
    name: vllm-epp
    port:
      number: 9002
    failureMode: FailClose
