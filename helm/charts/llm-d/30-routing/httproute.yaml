# =============================================================================
# HTTPRoute — routes gateway traffic to the InferencePool (not a Service)
# =============================================================================
# The backendRef is the InferencePool itself (group inference.networking.k8s.io,
# kind InferencePool). The gateway controller, seeing an InferencePool backend,
# delegates endpoint selection to the pool's EPP — that's the integration point
# that makes routing cache-aware instead of round-robin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llmd-route
  namespace: inference-prod
  labels:
    app.kubernetes.io/part-of: inferentia
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llmd-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-prod-pool
          port: 8000

