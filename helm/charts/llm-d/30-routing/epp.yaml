# =============================================================================
# EPP — Endpoint Picker (the cache-aware router)
# =============================================================================
# The brain of llm-d routing. For each request the Gateway forwards, the EPP
# scores every pod in the InferencePool by prefix-cache match + current load
# (from vLLM's /metrics) and returns the best pod's IP. The Gateway then sends
# the request there. See docs/kv-cache-and-routing.md Part 3.
#
# Pinned to Gateway API Inference Extension v1.6.0.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-epp
  namespace: inference-prod
---
# RBAC: the EPP watches the InferencePool + its member Pods, and reads
# EndpointSlices to discover pod IPs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vllm-epp
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.networking.x-k8s.io"]
    resources: ["inferencepoolimports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vllm-epp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vllm-epp
subjects:
  - kind: ServiceAccount
    name: vllm-epp
    namespace: inference-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-epp
  namespace: inference-prod
  labels:
    app: vllm-epp
    app.kubernetes.io/part-of: inferentia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-epp
  template:
    metadata:
      labels:
        app: vllm-epp
    spec:
      serviceAccountName: vllm-epp
      containers:
        - name: epp
          image: registry.k8s.io/gateway-api-inference-extension/epp:v1.6.0
          imagePullPolicy: IfNotPresent
          args:
            - "--pool-name"
            - "vllm-prod-pool"
            - "--pool-namespace"
            - "inference-prod"
            - "-v"
            - "3"
            - "--grpc-port"
            - "9002"
            - "--grpc-health-port"
            - "9003"
            - "--metrics-port"
            - "9090"
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
---
# The Service the InferencePool.endpointPickerRef points at (gRPC ext-proc).
apiVersion: v1
kind: Service
metadata:
  name: vllm-epp
  namespace: inference-prod
  labels:
    app: vllm-epp
spec:
  selector:
    app: vllm-epp
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
      appProtocol: http2

