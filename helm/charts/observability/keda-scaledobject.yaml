# =============================================================================
# KEDA ScaledObject — scale vLLM on KV-cache utilization (the real signal)
# =============================================================================
# Replaces the CPU-based HPA stub in the vllm-inference chart. CPU is a poor
# proxy for LLM load; KV-cache pressure is the metric that actually predicts
# when a replica is saturated. KEDA queries Prometheus and scales on it.
#
# Apply AFTER: KEDA installed (keda namespace) + kube-prometheus-stack running.
# One ScaledObject per environment namespace where autoscaling is desired
# (ppd/prod). Shown here for prod; duplicate with the namespace changed, or
# template it. Scale target = the vLLM Deployment.
#
# NOTE: disable the chart's HPA (autoscaling.enabled=false) where KEDA manages
# scaling, so the two controllers don't fight over the same Deployment.
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-inference-kvcache
  namespace: inference-prod
  labels:
    app.kubernetes.io/part-of: inferentia
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-prod-vllm-inference # release vllm-prod + chart vllm-inference
  minReplicaCount: 1 # promoted prod is a single signed replica; KEDA scales up
  # on load (proven in task 6). The llm-d routing demo's 2 pods come from a
  # SEPARATE deployment (helm/charts/llm-d/10-prod-2replicas.yaml), not KEDA,
  # so KEDA no longer needs to hold prod at 2 (which fought the RWO PVC).
  maxReplicaCount: 3 # bounded for the demo cluster's capacity
  cooldownPeriod: 60 # shorter for the demo so scale-down is observable
  pollingInterval: 15 # query Prometheus every 15s
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300 # avoid flapping on spiky LLM load
  triggers:
    # PRIMARY (prod intent): KV-cache utilization — the metric that best
    # predicts vLLM saturation on real workloads. On the demo's 0.5B model with
    # short completions the cache never fills enough to cross 0.70, so it stays
    # inactive here; keep it as the documented production signal.
    - type: prometheus
      metadata:
        serverAddress: "http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
        metricName: vllm_kv_cache_usage_perc
        query: 'avg(vllm:kv_cache_usage_perc{namespace="inference-prod"})'
        threshold: "0.70"
    # DEMO / CPU-inference signal: request queue depth. A single CPU replica
    # saturates on concurrency long before KV cache fills, so num_requests
    # (running + waiting) is the signal that actually moves under load here.
    # threshold 3 => scale up when avg in-flight per replica exceeds ~3.
    - type: prometheus
      metadata:
        serverAddress: "http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
        metricName: vllm_requests_in_flight
        query: 'sum(vllm:num_requests_running{namespace="inference-prod"} + vllm:num_requests_waiting{namespace="inference-prod"})'
        threshold: "3"
