# =============================================================================
# vllm-inference — PPD (Pre-Production) Values Override
# =============================================================================
# Applied via ArgoCD ApplicationSet (ppd app, tracks the `ppd` branch) or:
#   helm install -f values.yaml -f values-ppd.yaml
#
# PPD is the prod rehearsal: it should mirror prod as closely as possible so
# promotion to main carries no surprises. Autoscaling ON, prod-like resources,
# S3 source, ECR image. The main difference from prod is a slightly lower max
# replica ceiling to bound cost.
# =============================================================================

# -- Namespace
namespace: inference-ppd

# -- Container Image (from ECR, signed by CI). repository INJECTED by the
# ArgoCD ApplicationSet (helm.parameters) — empty here, chart stays generic.
image:
  repository: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# -- Model Configuration (S3 source — same artifact promoted from qa).
# s3Bucket INJECTED by the ApplicationSet (helm.parameters model.s3Bucket).
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"
  source: "s3"
  s3Bucket: ""
  s3Key: "Qwen2.5-0.5B-Instruct/"

# -- vLLM Serving (prod-like)
# replicas: 1 for the demo node group. Prod intent is 2 (and autoscaling below
# keeps min 2), but the 3-node t3.large cluster already runs dev + qa + system
# pods, leaving room for ~1 more vLLM pod. A 2nd replica sits Pending forever
# ("Insufficient cpu"), holding the app at Progressing. One replica proves the
# signed-image admission + serving; restore 2 on a larger prod cluster.
serving:
  replicas: 1
  dtype: "bfloat16"
  maxModelLen: 2048
  enforceEager: true
  port: 8000
  env:
    # KV-cache reservation must fit within the container memory limit AFTER the
    # model + runtime overhead. With an 8Gi limit, ~3.5Gi is free after load, so
    # a 4Gi KV reservation fails engine init ("Available memory ... less than
    # requested memory for kv (4.0 GiB)"). 2Gi fits with headroom (matches qa).
    # On a larger-memory prod node, raise this back toward 4.
    VLLM_CPU_KVCACHE_SPACE: "2"
    VLLM_TARGET_DEVICE: "cpu"
    TOKENIZERS_PARALLELISM: "false"

# -- Resources
# NOTE: prod-intent sizing is cpu req 4 / limit 8, but the demo node group is
# t3.large (2 vCPU, ~1.93 allocatable). With replicas: 2 that would need 8 vCPU
# of requests and NEITHER pod could schedule ("Insufficient cpu"). Right-sized
# to 750m request / 3 limit so both replicas fit across the 2-node group while
# still exercising multi-replica + autoscaling. On a larger prod node group,
# restore cpu req 4 / limit 8.
resources:
  requests:
    cpu: "750m"
    memory: "4Gi"
  limits:
    cpu: "3"
    memory: "8Gi"

# -- Persistent Volume
persistence:
  enabled: true
  storageClass: "gp3"
  size: 10Gi
  accessMode: ReadWriteOnce

shmSize: 2Gi

# -- Autoscaling ON (rehearse prod scaling), lower ceiling than prod for cost.
# minReplicas 1 for the demo (cluster fits ~1 vLLM pod); prod intent is min 2.
# The KEDA/HPA mechanism is still exercised — it just won't scale past what the
# demo node group can hold.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetKVCacheUtilization: 70

# -- Node placement
# Prod intent is dedicated inference nodes (nodeSelector node-role=inference +
# a matching taint/toleration). The demo node group is a single unlabeled,
# untainted t3.large pool, so pinning to node-role=inference leaves pods
# Pending ("didn't match node affinity/selector"). Left empty for the demo;
# on a prod cluster with a labeled+tainted inference pool, restore:
#   nodeSelector: { node-role: inference }
#   tolerations: [{ key: workload, operator: Equal, value: inference, effect: NoSchedule }]
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - vllm-inference
          topologyKey: topology.kubernetes.io/zone

# -- NetworkPolicy: INHERITED from values.yaml (enabled: true, same gateway /
# prometheus / dns / egress selectors as every EKS env). Not repeated here
# because PPD's network posture is identical to the shared baseline. As the
# prod rehearsal, PPD deliberately keeps the SAME segmentation as prod. Local
# kind disables it in values-kind.yaml.
