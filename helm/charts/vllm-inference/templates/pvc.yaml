{{- if .Values.persistence.enabled }}
# =============================================================================
# PersistentVolumeClaim — Model Weights Storage
# =============================================================================
# This PVC holds the downloaded model weights. The model-download Job writes
# to it once, then all vLLM pods mount it read-only for fast startup.
# On EKS: backed by EBS gp3 (or EFS for ReadWriteMany if scaling beyond 1 AZ)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vllm-inference.pvcName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
  annotations:
    # Created as a pre-install/pre-upgrade hook so it exists BEFORE the
    # model-download Job (also a pre-install hook, weight -5) runs. A lower
    # weight (-10) means Helm creates this PVC first. Without this, the Job
    # is scheduled before the PVC exists and stays Pending forever.
    # NOTE: no "hook-succeeded"/"hook-failed" delete policy — the PVC must
    # persist after hooks complete so the vLLM Deployment can mount it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
