{{- if .Values.serviceAccount.create }}
# =============================================================================
# ServiceAccount — the identity the model-download pod (and vLLM) runs as
# =============================================================================
# This is the link between Terraform's EKS Pod Identity association and the
# running pod: Terraform maps (cluster, namespace, THIS SA name) -> an IAM role
# scoped to read the model S3 bucket. The pod then gets rotated AWS creds with
# NO static keys.
#
# NOTE (Pod Identity vs IRSA): with Pod Identity there is deliberately NO
# `eks.amazonaws.com/role-arn` annotation here. The mapping lives in AWS
# (Terraform), not on the ServiceAccount. That's the visible difference from
# IRSA and is intentional.
#
# Created as a pre-install hook. Explicit hook-weight ORDERING (lower runs
# first) so the whole pre-install chain is deterministic:
#   ServiceAccount (-15)  identity must exist first
#   PVC            (-10)  storage before the Job that writes to it
#   Job            (-5)   download; needs BOTH the SA and the PVC
# (Same-weight hooks have no guaranteed order, so we separate them.)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
{{- end }}
