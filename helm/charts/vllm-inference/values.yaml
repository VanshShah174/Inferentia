# =============================================================================
# vllm-inference — Default Values (Dev Environment)
# =============================================================================
# These values are the baseline. Override per environment:
#   Dev:  values.yaml (this file)
#   Prod: values-prod.yaml
# =============================================================================

# -- Namespace (base = dev; overridden per environment in values-<env>.yaml).
# MUST match the ApplicationSet destination namespace for this environment,
# because every template pins resources to .Values.namespace.
namespace: inference-dev

# -- ServiceAccount
# The model-download pod runs as THIS ServiceAccount. On EKS a Pod Identity
# association (in Terraform) maps (cluster, namespace, this SA) -> the S3-read
# IAM role, so `aws s3 sync` gets credentials with NO static keys and NO IRSA
# role-arn annotation. If the pod ran as the `default` SA it would have no
# association and S3 access would fail with "Unable to locate credentials".
serviceAccount:
  create: true
  name: "vllm-model-loader"

# -- Model Configuration
# BASE = dev-on-EKS. dev pulls the same S3-seeded artifact as the other
# environments (source: s3) so it faithfully rehearses the Pod-Identity -> S3
# -> PVC path. (Local/kind runs use values-kind.yaml with source: huggingface.)
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"
  # Source for model download job (s3 or huggingface)
  source: "s3"
  # S3 bucket + key (seeded once via scripts/seed-model.sh). <AWS_ACCOUNT_ID>
  # is filled from Terraform output at deploy time.
  s3Bucket: "inferentia-model-store-<AWS_ACCOUNT_ID>"
  s3Key: "Qwen2.5-0.5B-Instruct/"

# -- Container Image
# dev pulls the UNSIGNED image from ECR (seeded once via scripts/seed-ecr.sh,
# then replaced by CI at the first PR dev->qa). Kyverno does NOT require a
# signature in dev (signing starts at ppd), so an unsigned image is valid here.
image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.ca-central-1.amazonaws.com/inferentia/vllm-cpu
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# -- Model Downloader Job
modelDownloader:
  enabled: true
  image:
    repository: python
    tag: "3.11-slim"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# -- vLLM Serving Configuration
serving:
  replicas: 1
  dtype: "bfloat16"
  maxModelLen: 512
  enforceEager: true
  port: 8000
  # Environment variables
  env:
    VLLM_CPU_KVCACHE_SPACE: "1"
    VLLM_TARGET_DEVICE: "cpu"
    TOKENIZERS_PARALLELISM: "false"

# -- Resource Requests and Limits
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# -- Persistent Volume (model weights storage)
persistence:
  enabled: true
  storageClass: ""  # Uses cluster default (gp3 on EKS)
  size: 5Gi
  accessMode: ReadWriteOnce

# -- Shared Memory (required by vLLM for IPC)
shmSize: 1Gi

# -- Health Probes
probes:
  readiness:
    path: /health
    port: 8000
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

# -- Service
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# -- ServiceMonitor (Prometheus scraping)
serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

# -- Autoscaling (HPA stub — KEDA in production)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetKVCacheUtilization: 70

# -- Pod Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # vLLM needs to write to cache dirs
  capabilities:
    drop:
      - ALL

# -- Node Selector (for targeting inference nodes)
nodeSelector: {}
  # node-role: inference

# -- Tolerations
tolerations: []

# -- Affinity
affinity: {}

# -- Labels applied to all resources
# NOTE: app.kubernetes.io/component is intentionally NOT here — it is
# per-resource (inference vs. model-downloader), so each template sets its
# own. Putting it in commonLabels caused a duplicate-key collision in the
# model-download Job.
commonLabels:
  app.kubernetes.io/part-of: inferentia
