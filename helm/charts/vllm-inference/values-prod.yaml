# =============================================================================
# vllm-inference — Production Values Override
# =============================================================================
# These values override the defaults in values.yaml for production deployment.
# Applied via: helm install -f values.yaml -f values-prod.yaml
# Or via ArgoCD ApplicationSet targeting the prod branch.
#
# Key differences from dev:
#   - More replicas
#   - Larger model context window
#   - Autoscaling enabled
#   - Higher resource limits
#   - ECR image (not local)
#   - Node selector for inference nodes
# =============================================================================

# -- Namespace (every template pins to .Values.namespace; must match the
# ApplicationSet destination for prod)
namespace: inference-prod

# -- Container Image (from ECR, signed by CI). repository INJECTED by the
# ArgoCD ApplicationSet (helm.parameters) — empty here, chart stays generic.
image:
  repository: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# -- Model Configuration (SAME bucket + key as qa/ppd — one artifact promoted).
# s3Bucket INJECTED by the ApplicationSet (helm.parameters model.s3Bucket).
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"
  source: "s3"
  s3Bucket: ""
  s3Key: "Qwen2.5-0.5B-Instruct/"

# -- vLLM Serving Configuration (production tuned)
# replicas: 2 — required for the llm-d cache-aware routing demo: the EPP must
# have >1 pod to choose between. Both replicas co-locate on one node (see
# affinity below) so they can share the ReadWriteOnce model PVC read-only.
# --enable-prefix-caching (extraArgs) makes KV-cache reuse observable, which is
# what the EPP's prefix-hash routing keys on. KVCACHE 2 fits the 8Gi limit.
serving:
  replicas: 2
  dtype: "bfloat16"
  maxModelLen: 2048
  enforceEager: true
  port: 8000
  extraArgs:
    - "--enable-prefix-caching"
  env:
    VLLM_CPU_KVCACHE_SPACE: "2"
    VLLM_TARGET_DEVICE: "cpu"
    TOKENIZERS_PARALLELISM: "false"

# -- Resource Requests and Limits (right-sized for the demo node group)
resources:
  requests:
    cpu: "750m"
    memory: "4Gi"
  limits:
    cpu: "3"
    memory: "8Gi"

# -- Persistent Volume (larger for production models)
persistence:
  enabled: true
  storageClass: "gp3"
  size: 10Gi
  accessMode: ReadWriteOnce

# -- Shared Memory
shmSize: 2Gi

# -- Autoscaling: KEDA owns prod scaling (ScaledObject on KV-cache), NOT the
# chart's CPU HPA. Two autoscalers on one Deployment conflict (KEDA's admission
# webhook rejects a ScaledObject whose target already has an HPA). So the chart
# HPA is DISABLED here; scaling is driven by helm/charts/observability/
# keda-scaledobject.yaml (Prometheus vllm:kv_cache_usage_perc trigger).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetKVCacheUtilization: 70

# -- Node placement
# Prod intent is dedicated inference nodes (nodeSelector node-role=inference +
# matching taint/toleration). The demo node group is unlabeled/untainted, so
# pinning leaves pods Pending ("didn't match node affinity/selector"). Empty
# for the demo; restore on a labeled+tainted prod inference pool.
nodeSelector: {}

tolerations: []

# -- Affinity: CO-LOCATE the 2 replicas on the SAME node (REQUIRED here).
# The model PVC is ReadWriteOnce (EBS) — two replicas can only mount it (even
# read-only) if they're on the same node. So we use podAffinity (attract to the
# same node), NOT anti-affinity. requiredDuringScheduling makes it hard: the 2nd
# replica MUST land where the 1st is. A t3.large (2 vCPU) fits both at 750m req.
# (Prod intent on real multi-node HA would use ReadWriteMany/EFS + anti-affinity
# to spread across AZs — documented trade-off for the demo cluster.)
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - vllm-inference
        topologyKey: kubernetes.io/hostname

# -- NetworkPolicy: INHERITED from values.yaml (enabled: true, same gateway /
# prometheus / dns / egress selectors as every EKS env). Not repeated here
# because prod uses the shared segmentation baseline unchanged. Override here
# ONLY if prod ever needs a stricter posture than the other envs. Local kind
# disables it in values-kind.yaml.
