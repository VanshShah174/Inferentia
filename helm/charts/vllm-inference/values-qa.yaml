# =============================================================================
# vllm-inference — QA Values Override
# =============================================================================
# Applied via ArgoCD ApplicationSet (qa app, tracks the `qa` branch) or:
#   helm install -f values.yaml -f values-qa.yaml
#
# QA sits between dev and prod: it uses the SAME S3 model source and ECR image
# as prod (so QA truly validates the promotion path), but stays small and
# WITHOUT autoscaling (QA is for functional validation, not load).
#
# Progressive sizing: dev(1, HF, local img) < QA(1, s3, ECR) < ppd < prod.
# =============================================================================

# -- Namespace
namespace: inference-qa

# -- Container Image (from ECR, signed by CI). Region is ca-central-1.
image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.ca-central-1.amazonaws.com/inferentia/vllm-cpu
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# -- Model Configuration (S3 source — same controlled artifact as prod)
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"
  source: "s3"
  s3Bucket: "inferentia-model-store-<AWS_ACCOUNT_ID>"
  s3Key: "Qwen2.5-0.5B-Instruct/"

# -- vLLM Serving (QA: single replica, modest context)
serving:
  replicas: 1
  dtype: "bfloat16"
  maxModelLen: 1024
  enforceEager: true
  port: 8000
  env:
    VLLM_CPU_KVCACHE_SPACE: "2"
    VLLM_TARGET_DEVICE: "cpu"
    TOKENIZERS_PARALLELISM: "false"

# -- Resources (between dev and prod)
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# -- Persistent Volume
persistence:
  enabled: true
  storageClass: "gp3"
  size: 10Gi
  accessMode: ReadWriteOnce

shmSize: 1Gi

# -- Autoscaling OFF in QA (functional validation, not load testing)
autoscaling:
  enabled: false
