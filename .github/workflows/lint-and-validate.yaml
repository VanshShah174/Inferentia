# =============================================================================
# Lint & Validate — fastest, cheapest checks
# =============================================================================
# Runs on: PR to dev, qa, ppd (every promotable branch)
# Purpose: Catch secrets, malformed YAML, unrendered Helm, bad Terraform
#          BEFORE a reviewer spends attention on the PR.
# Cost:    ~30s. No image build. No cloud credentials needed.
#
# Design: per-concern (this file = one concern: static validation).
#         paths-ignore (denylist) so NEW folders are linted by default;
#         only docs/markdown are skipped.
# =============================================================================
name: Lint & validate

on:
  pull_request:
    branches: [dev, qa, ppd]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'local-testing/**'

# Cancel superseded runs on the same PR to avoid runner waste / queue pileup.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so secret scanners can diff commits

      # -----------------------------------------------------------------------
      # Secret detection — two tools, defense in depth
      # -----------------------------------------------------------------------
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          # Required by gitleaks-action to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: detect-secrets (baseline scan)
        run: |
          python -m pip install --quiet detect-secrets==1.5.0
          if [ -f .secrets.baseline ]; then
            detect-secrets scan --baseline .secrets.baseline
          else
            echo "::warning::.secrets.baseline not found — running scan without baseline"
            detect-secrets scan
          fi

      # -----------------------------------------------------------------------
      # Helm — lint + render + schema-validate the rendered manifests
      # -----------------------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.2

      - name: Helm lint (dev values)
        run: helm lint helm/charts/vllm-inference/

      - name: Helm lint (prod values)
        run: helm lint helm/charts/vllm-inference/ -f helm/charts/vllm-inference/values-prod.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Helm template + kubeconform (schema validation)
        run: |
          helm template vllm helm/charts/vllm-inference/ \
            -f helm/charts/vllm-inference/values.yaml \
            | kubeconform -strict -summary -verbose \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      # -----------------------------------------------------------------------
      # Terraform — format + validate (only if terraform/ has .tf files)
      # -----------------------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt (check)
        run: |
          if ls terraform/*.tf >/dev/null 2>&1 || find terraform -name '*.tf' | grep -q .; then
            terraform -chdir=terraform fmt -check -recursive
          else
            echo "No Terraform files yet — skipping fmt check"
          fi

      - name: Terraform validate
        run: |
          if find terraform -name '*.tf' 2>/dev/null | grep -q .; then
            terraform -chdir=terraform init -backend=false
            terraform -chdir=terraform validate
          else
            echo "No Terraform files yet — skipping validate"
          fi

      # -----------------------------------------------------------------------
      # YAML lint — uses the repo's committed .yamllint.yaml config
      # -----------------------------------------------------------------------
      - name: yamllint
        run: |
          python -m pip install --quiet yamllint==1.35.1
          yamllint -c .yamllint.yaml .
